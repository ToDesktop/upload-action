name: ToDesktop upload
description: >-
  Upload the apps this job built to ToDesktop. Checks the apps
  todesktop.config.ts lists that are on this runner, runs its prepareApp hook on
  copies, and uploads them, authenticated by the job's GitHub OIDC token (needs
  permissions: id-token: write). Every job of a workflow run adds to one build,
  which ToDesktop signs, notarizes, packages and smoke tests. With wait, the job
  then reports how that build went, in its log and on the pull request.
inputs:
  version:
    description:
      Version to release; a leading v is dropped, so github.ref_name works.
      Defaults to the config's, or the Mac app's own.
    required: false
  test:
    description:
      'true makes a test build: ToDesktop builds, signs and smoke-tests it like
      any other, and never releases it. Every job of the run passes the same
      value.'
    required: false
  config:
    description:
      Path to todesktop.config.ts (found in the working directory by default).
    required: false
  wait:
    description:
      "'true' uploads, then waits for ToDesktop's result of the run's build and
      its smoke test, prints it, and fails the job with the reason when either
      failed. 'only' uploads nothing and waits for the result of this workflow
      run's build: for a last job that needs the jobs that upload."
    required: false
    default: 'false'
  wait-timeout:
    description:
      Minutes to wait for the result. Running out fails the job, but it is not a
      verdict on the build; re-running the job waits again.
    required: false
    default: '90'
  app:
    description:
      "The app's ID, for wait: only in a job with no checkout. With a checkout
      it is read from todesktop.config.ts."
    required: false
  details:
    description:
      "Whether a failed smoke test prints the end of the app's output: auto
      (only in a private repository, as a public repository's logs are public),
      true or false."
    required: false
    default: auto
  comment:
    description:
      "With wait: 'false' stops the job writing the build's result as a comment
      on the open pull request whose head is the run's commit. It writes one
      comment and updates it on later runs, and needs permissions:
      pull-requests: write; without that the log says why there is no comment
      and the job ends as it would have."
    required: false
    default: 'true'
  github-token:
    description:
      The GitHub token that writes the comment. The job's own unless you give
      another.
    required: false
    default: ${{ github.token }}
  url:
    description:
      The ToDesktop edge to upload to. Production's by default; only ToDesktop's
      own test stages set it.
    required: false
    default: https://updates.todesktop.com
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
    # esbuild loads todesktop.config.ts; it ships a native binary per platform,
    # so it's installed here rather than bundled. The CLI imports it whatever
    # it's asked to do, so a job that only waits installs it too.
    - shell: bash
      run:
        npm install --silent --no-save --no-package-lock --prefix
        "$GITHUB_ACTION_PATH" esbuild@0.28.2
    - shell: bash
      env:
        TODESKTOP_URL: ${{ inputs.url }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_WAIT: ${{ inputs.wait }}
        INPUT_WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        INPUT_APP: ${{ inputs.app }}
        INPUT_DETAILS: ${{ inputs.details }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        # The token is for the comment alone: an upload, and the config's
        # prepareApp hook it runs, never have it in their environment.
        comment_token="$INPUT_GITHUB_TOKEN"
        unset INPUT_GITHUB_TOKEN
        case "$INPUT_WAIT" in
          ''|false|true|only) ;;
          *) echo "wait is 'false', 'true' or 'only', not '$INPUT_WAIT'" >&2; exit 2 ;;
        esac
        if [ "$INPUT_WAIT" = "only" ]; then
          # No upload: this job waits for the result of the run's build.
          args=(report)
          if [ -n "$INPUT_APP" ]; then args+=(--app "$INPUT_APP"); fi
        else
          args=(upload)
          if [ -n "$INPUT_VERSION" ]; then args+=(--version "${INPUT_VERSION#v}"); fi
          if [ "$INPUT_TEST" = "true" ]; then args+=(--test); fi
          if [ "$INPUT_WAIT" = "true" ]; then args+=(--wait); fi
        fi
        if [ -n "$INPUT_CONFIG" ]; then args+=(--config "$INPUT_CONFIG"); fi
        if [ "$INPUT_WAIT" = "true" ] || [ "$INPUT_WAIT" = "only" ]; then
          if [ -n "$INPUT_WAIT_TIMEOUT" ]; then args+=(--wait-timeout "$INPUT_WAIT_TIMEOUT"); fi
          if [ -n "$INPUT_DETAILS" ]; then args+=(--details "$INPUT_DETAILS"); fi
          if [ "$INPUT_COMMENT" = "false" ]; then
            args+=(--no-comment)
          else
            # The CLI takes it out of its environment as it starts.
            export TODESKTOP_GITHUB_TOKEN="$comment_token"
          fi
        fi
        node "$GITHUB_ACTION_PATH/dist/todesktop.mjs" "${args[@]}"
